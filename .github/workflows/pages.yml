name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked --version 0.3.7

      - name: Build release site
        run: cargo leptos build --release

      - name: Generate static entry point
        run: target/release/server --generate-site
        env:
          LEPTOS_ENV: PROD
          LEPTOS_OUTPUT_NAME: rosary
          LEPTOS_SITE_PKG_DIR: pkg
          LEPTOS_SITE_ROOT: target/site
          ROSARIO_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Disable Jekyll processing
        run: touch target/site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
